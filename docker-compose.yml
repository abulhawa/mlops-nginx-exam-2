services:
  sentiment-api-v1:
    build: 
      dockerfile: src/api/v1/Dockerfile
      context: .
    deploy:
      replicas: 3
    expose:
      - "8000"
      
  sentiment-api-v2:
    build: 
      dockerfile: src/api/v2/Dockerfile
      context: .
    deploy:
      replicas: 1
    expose:
      - "8000"  

  nginx:
    build:
      dockerfile: Dockerfile
      context: deployments/nginx/
    container_name: nginx_revproxy
    ports:
      - "8080:80"
      - "443:443"
    depends_on:
      sentiment-api-v1:
        condition: service_started
      sentiment-api-v2:
        condition: service_started
    volumes:
      - ./deployments/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deployments/nginx/certs:/etc/nginx/certs:ro
      - ./deployments/nginx/.htpasswd:/etc/nginx/.htpasswd:ro

  nginx_exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: nginx_exporter
    ports:
      - "9113:9113"
    depends_on:
      - nginx
    environment:
      SCRAPE_URI: https://nginx/nginx_status
  
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus_server
    ports:
      - "9090:9090"
    volumes:
      - ./deployments/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - nginx

  grafana:
    image: grafana/grafana:latest
    container_name: grafana_dashboard
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin

volumes:
  prometheus_data:
  grafana_data: