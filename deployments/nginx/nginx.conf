events {
    worker_connections 1024; # Maximum number of connections per process
}

http {
    # set bounding box
    limit_req_zone $binary_remote_addr zone=apilimit:10m rate=10r/s;

    # Route debug requests to v2; use v1 for all other requests.
    map $http_x_experiment_group $selected_backend {
        default sentiment-apis;
        debug sentiment-api-v2;
    }

    upstream sentiment-apis {
       server sentiment-api-v1:8000;
    }
    upstream sentiment-api-v2 {
       server sentiment-api-v2:8000;
    }
    # Defining our virtual server
    server {
        listen 80;
        server_name localhost; # Domain name or IP that this server block manages
        return 301 https://$host$request_uri;
    }

    server {

        listen 443 ssl;
        server_name localhost; # Domain name or IP that this server block manages
        # Paths to SSL certificates inside the Nginx container
        ssl_certificate /etc/nginx/certs/nginx.crt;
        ssl_certificate_key /etc/nginx/certs/nginx.key;
        # SSL protocols and ciphers
        ssl_protocols TLSv1.2 TLSv1.3; # Only allow modern versions of TLS
        ssl_ciphers HIGH:!aNULL:!MD5; # List of allowed cipher suites
        ssl_prefer_server_ciphers on; # Prefer server ciphers

        # All requests that start with /predict/ will be handled here
        location /predict {
            auth_basic "API Access Protected"; # Message displayed to the user
            auth_basic_user_file /etc/nginx/.htpasswd;

            # Applies the limitation to the `location/predict` block
            # Allow a burst of 5 excess requests without delaying accepted requests.
            limit_req zone=apilimit burst=5 nodelay;

            # using the mapping defined by $selected_backend allows the selection of different
            # api versions depending on the X-experiment_group header
            proxy_pass http://$selected_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /nginx_status {
            stub_status on; # Active le module stub_status
            access_log off; # Do not log access to this endpoint
            allow 127.0.0.1; # Allow access only from localhost (export it)
            allow 172.18.0.0/16; # Or from the Docker network
            deny all; # Blocks all other access
        }
    }
}
